<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Parkplätze</title>
<style>
:root { --bg:#eef2f7; --surface:#fff; --ink:#0e1a2b; --muted:#5a6a80; --line:#d8e0eb; --sign:#1456b8; --on-sign:#fff; --cover:#0f7a4a; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0a1120; --surface:#121b2c; --ink:#e6ecf5; --muted:#95a5bc; --line:#26344d; --sign:#5b93f0; --on-sign:#06101f; --cover:#4cc38a; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
h1 { font-size: 21px; margin: 0; }
.muted { color: var(--muted); font-size: 14px; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.kind { font-weight: 700; }
.kind.cov { color: var(--cover); }
.walk { font-weight: 600; white-space: nowrap; }
.far { color: var(--muted); font-weight: 400; font-size: 14px; }
.meta { color: var(--muted); font-size: 15px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { display: block; text-align: center; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 11px; padding: 11px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--sign); border-color: var(--sign); color: var(--on-sign); }
</style>
</head>
<body>
<main>
  <h1 id="head">Parkplätze</h1>
  <p class="muted" id="sub">Öffne diese Seite über eine Sammel-Meldung des Parkplatz-Wächters.</p>
  <div id="list" style="display:grid;gap:12px"></div>
</main>
<script>
(function () {
  function dec(h) {
    h = h.replace(/-/g, '+').replace(/_/g, '/');
    while (h.length % 4) h += '=';
    var bin = atob(h), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function enc(o) {
    var bytes = new TextEncoder().encode(JSON.stringify(o)), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function ab(f) {
    if (!f || f === 'nach Vereinbarung') return 'nach Vereinbarung';
    return f === 'sofort' ? 'ab sofort' : 'ab ' + f;
  }
  var d = null;
  try { d = dec(location.hash.slice(1)); } catch (e) { d = null; }
  if (!d || !d.i) return;

  document.getElementById('head').textContent = d.t || 'Parkplätze';
  document.title = d.t || 'Parkplätze';
  document.getElementById('sub').textContent = d.i.length + (d.i.length === 1 ? ' Inserat' : ' Inserate') + ', überdachte zuerst. Tippe auf ein Inserat, um es zu öffnen.';
  var list = document.getElementById('list');
  d.i.forEach(function (l) {
    var c = el('div', 'card');
    var top = el('div', 'top');
    top.appendChild(el('span', 'kind' + (l.c ? ' cov' : ''), l.k));
    var w = el('span', 'walk', l.w + ' Min. zu Fuss');
    if (d.x && l.w > d.x) { w.appendChild(document.createTextNode(' ')); w.appendChild(el('span', 'far', 'etwas weiter')); }
    top.appendChild(w);
    c.appendChild(top);
    c.appendChild(el('div', null, l.s));
    c.appendChild(el('div', 'meta', l.p + ' · ' + ab(l.f) + ' · ' + l.q));
    var row = el('div', 'row');
    var open = el('a', 'btn primary', 'Inserat öffnen');
    open.href = l.u; open.target = '_blank'; open.rel = 'noopener';
    row.appendChild(open);
    var req = el('a', 'btn', 'Anfragetext');
    req.href = 'anfrage.html#' + enc({ a: l.a, s: l.s, f: l.f, u: l.u });
    row.appendChild(req);
    c.appendChild(row);
    list.appendChild(c);
  });
})();
</script>
</body>
</html>
