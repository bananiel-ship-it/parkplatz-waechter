<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Parkplatz-Anfrage</title>
<style>
:root { --bg:#eef2f7; --surface:#fff; --ink:#0e1a2b; --muted:#5a6a80; --line:#d8e0eb; --sign:#1456b8; --on-sign:#fff; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0a1120; --surface:#121b2c; --ink:#e6ecf5; --muted:#95a5bc; --line:#26344d; --sign:#5b93f0; --on-sign:#06101f; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-size: 22px; margin: 0; }
.muted { color: var(--muted); font-size: 14px; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
label { font-size: 13px; font-weight: 600; color: var(--muted); display: grid; gap: 4px; }
input, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
textarea { min-height: 240px; resize: vertical; font-size: 15px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { display: block; text-align: center; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 13px; font: 600 16px inherit; font-family: inherit; cursor: pointer; }
.btn.primary { background: var(--sign); border-color: var(--sign); color: var(--on-sign); }
#status { min-height: 1.5em; font-size: 14px; color: var(--sign); margin: 0; }
</style>
</head>
<body>
<main>
  <h1 id="head">Parkplatz-Anfrage</h1>
  <p class="muted" id="sub">Öffne diese Seite über den Knopf „Anfragetext“ in einer Push-Nachricht.</p>
  <div class="card">
    <div class="row">
      <label for="name">Dein Name<input id="name" autocomplete="name"></label>
      <label for="tel">Telefon<input id="tel" type="tel" autocomplete="tel"></label>
    </div>
    <p class="muted">Name und Telefon bleiben nur auf diesem Gerät gespeichert.</p>
  </div>
  <label for="text">Anfragetext<textarea id="text"></textarea></label>
  <div class="row">
    <button class="btn primary" id="copy" type="button">Text kopieren</button>
    <a class="btn" id="open" href="#" target="_blank" rel="noopener">Inserat öffnen</a>
  </div>
  <p id="status" role="status"></p>
</main>
<script>
(function () {
  var d = null;
  try {
    var h = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    while (h.length % 4) h += '=';
    var bin = atob(h), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    d = JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { d = null; }

  var $ = function (id) { return document.getElementById(id); };
  function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  $('name').value = load('pw-name');
  $('tel').value = load('pw-tel');

  function ab(f) {
    if (!f || f === 'nach Vereinbarung') return 'nach Vereinbarung';
    return f === 'sofort' ? 'ab sofort' : 'ab ' + f;
  }
  function render() {
    if (!d) { $('text').value = ''; return; }
    var name = $('name').value.trim() || '[Ihr Name]';
    var tel = $('tel').value.trim() || '[Telefonnummer]';
    $('text').value = 'Guten Tag\n\n' +
      'Ich habe Ihr Inserat für den ' + d.a + ' an der ' + d.s + ' gesehen und bin sehr interessiert. ' +
      'Ich wohne ganz in der Nähe und kann den Platz ' + ab(d.f) + ' übernehmen.\n\n' +
      'Gerne komme ich für eine Besichtigung vorbei. Wann passt es Ihnen?\n\n' +
      'Freundliche Grüsse\n' + name + '\n' + tel;
  }
  if (d) {
    $('head').textContent = d.a + ', ' + d.s;
    $('sub').textContent = 'Text kopieren, dann das Inserat öffnen und den Text ins Kontaktformular einfügen.';
    $('open').href = d.u;
  } else {
    $('open').removeAttribute('href');
  }
  ['name', 'tel'].forEach(function (k) {
    $(k).addEventListener('input', function () { save('pw-' + k, $(k).value); render(); });
  });
  $('copy').addEventListener('click', function () {
    var t = $('text');
    var done = function () { $('status').textContent = 'Kopiert. Jetzt „Inserat öffnen“ und einfügen.'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t.value).then(done, function () { t.select(); document.execCommand('copy'); done(); });
    } else { t.select(); document.execCommand('copy'); done(); }
  });
  render();
})();
</script>
</body>
</html>
